[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "esp32-ai-security"
version = "1.0.0"
description = "ESP32 camera security gateway with YOLO and Qwen vision analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "python-multipart",
    "ultralytics",
    "Pillow",
    "openai",
    "requests",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[project.scripts]
esp32-security = "esp32_ai_security.main:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["esp32_ai_security*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
